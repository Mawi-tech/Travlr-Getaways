<div class="card">
  <div class="card-header">
    {{ trip.name }}
  </div>

  <img 
    class="card-img-top"
    [src]="'assets/images/' + trip.image"
    [alt]="trip.name"
  >

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-text">
      {{ trip.length }} only
      <br>
      ${{ trip.perPerson }} per person
    </p>

    <p class="card-text" [innerHTML]="trip.description"></p>
    <button (click)="editTrip(trip)" class="btn btn-primary">Edit</button>
  </div>
</div>
